name: "Build and publish image"

on:
  workflow_dispatch:
  push:

permissions:
  packages: write

jobs:
  publish_images:
    name: 'Build and publish image'
    runs-on: ubuntu-latest
    env:
      REPOBASE: ghcr.io/${{ github.repository_owner }}
      IMAGETAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - id: install-podman
        run: |
          # Install podman and buildah, they are no longer preinstalled on every runner image
          sudo apt update
          sudo apt-get -y install --install-recommends podman buildah
          # The crun shipped by the runner image is not compatible with the podman coming from apt
          command -v runc >/dev/null || sudo apt-get -y install runc
      - id: build
        run: |
          # Build the module image
          REPOBASE=${REPOBASE,,}
          IMAGENAME=${REPOBASE}/nethvoice-cti
          IMAGETAG=${IMAGETAG:-latest}
          if [[ "${IMAGETAG}" == "main" || "${IMAGETAG}" == "master" ]]; then
             IMAGETAG="latest"
          else
            IMAGETAG=$(echo "${IMAGETAG}" | tr '[:upper:]' '[:lower:]' | sed -E 's|[^a-z0-9_.-]|-|g; s|^[.-]+||; s|[.-]+$||; s|-+|-|g')
            if [[ -z "${IMAGETAG}" ]]; then
              IMAGETAG="latest"
            fi
          fi
          echo "REPOBASE=$REPOBASE" >> $GITHUB_ENV
          echo "IMAGETAG=$IMAGETAG" >> $GITHUB_ENV
          echo "IMAGENAME=$IMAGENAME" >> $GITHUB_ENV
          podman --runtime runc build -t ${IMAGENAME}:${IMAGETAG} .
      - id: publish
        run: |
          # Publish the branch
          trap 'buildah logout ghcr.io' EXIT
          buildah login -u ${{ github.actor }} --password-stdin ghcr.io <<<"${{ secrets.GITHUB_TOKEN }}"
          buildah push ${IMAGENAME}:${IMAGETAG} docker://${IMAGENAME}:${IMAGETAG}
          echo "::notice title=Image URL::${IMAGENAME}:${IMAGETAG}"
